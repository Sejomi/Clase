<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form1</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            margin-top: 10px;
        }
        input, select, button {
            margin-top: 5px;
        }
    </style>
</head>
<body>
<form action="#" method="post">
  <p>
    <label for="nombre1">Introduce tu nombre:</label>
    <input type="text" id="nombre1" name="nombre" placeholder="Introduce tu nombre"
           maxlength="100" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+" title="Sólo letras, sin números ni símbolos" required>
  </p>
  <p>
    <label for="email1">Introduce tu email:</label>
    <input type="email" id="email1" name="email" placeholder="email@gmail.com" required>
  </p>
  <p>
    <label for="pass1">Introduce una contraseña:</label>
    <input type="password" id="pass1" name="password" placeholder="contraseña"
           minlength="8"
           pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
           title="Mínimo 8 caracteres, con al menos una mayúscula, un número y un carácter especial" required>
  </p>
  <p>
    <label for="edad1">Indica su edad (18-40):</label>
    <input type="number" id="edad1" name="edad" min="18" max="40" step="1" style="width:50px" required>
  </p>
  <p>
    Selecciona qué estudias:
    <label><input type="radio" name="estudios" value="DAM" required> DAM</label>
    <label><input type="radio" name="estudios" value="DAW"> DAW</label>
  </p>
  <p>
    ¿Qué estudios previos tienes?
    <label><input type="checkbox" name="previos" value="ESO"> ESO</label>
    <label><input type="checkbox" name="previos" value="Bachiller"> Bachiller</label>
    <label><input type="checkbox" name="previos" value="SMR"> SMR</label>
    <label><input type="checkbox" name="previos" value="ASIR"> ASIR</label>
  </p>
  <p>
    <label for="foto1">Imagen de perfil:</label>
    <input type="file" id="foto1" name="foto" accept="image/*">
  </p>
  <p><button type="submit">Enviar</button></p>
</form>
</body>
</html>
